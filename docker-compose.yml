version: "3.9"

services:
  # ─── Backend API ────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: incident_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Celery Worker ──────────────────────────────────────────────────────────────
  celery_worker:
    build: ./backend
    container_name: incident_celery_worker
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,email,sla,reports,cleanup
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Celery Beat (Scheduler) ────────────────────────────────────────────────────
  celery_beat:
    build: ./backend
    container_name: incident_celery_beat
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - incident_network

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: incident_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: incident_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Redis ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: incident_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - incident_network

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: incident_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Frontend ───────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: incident_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Nginx (Reverse Proxy) ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: incident_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - incident_network

  # ─── Ollama (Local AI) ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: incident_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - incident_network
    deploy:
      resources:
        limits:
          memory: 4G

# ─── Volumes ──────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ollama_data:

# ─── Networks ─────────────────────────────────────────────────────────────────────
networks:
  incident_network:
    driver: bridge
